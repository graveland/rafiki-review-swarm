[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "review-swarm"
version = "0.1.0"
description = "Multi-agent code review on a rafiki daemon: lens-driven finders, panels and verifiers"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rafiki-py @ git+https://github.com/graveland/rafiki.git@v0.1.9#subdirectory=sdk/python",
    "pyyaml>=6",
]

[project.scripts]
review-swarm = "review_swarm.cli:swarm_main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["review_swarm"]

[dependency-groups]
dev = ["pytest>=8"]
